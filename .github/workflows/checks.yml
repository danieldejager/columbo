name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  data-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out base branch (check code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out PR head (data only, never executed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run checks (fail closed)
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f base/tools/checks/gate.py
          python3 base/tools/checks/gate.py --timeout 240 --report "$RUNNER_TEMP/report.json" -- \
            python3 base/tools/checks/run_checks.py --repo pr \
              --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --report "$RUNNER_TEMP/report.json"

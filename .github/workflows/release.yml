name: release

# Manual only. Builds the database from entries/ on main, checks it, and
# creates a DRAFT release with exactly two files: the database and its
# sha256 file. The draft stays a draft until the maintainer acts on it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: repo
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{1,4}(\.[0-9]{1,4}){0,2}$ ]] || { echo "bad tag"; exit 1; }

      - name: Check entries and build the database (fail closed)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 repo/tools/release_db.py --repo repo --tag "$TAG" --out-dir "$RUNNER_TEMP/out"

      - name: Check the database
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 repo/tools/derive/check_db.py "$RUNNER_TEMP/out/columbo-$TAG.db" \
            --expect "$RUNNER_TEMP/out/columbo-$TAG.names"

      - name: Compute sha256
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          sha256sum "columbo-$TAG.db" > "columbo-$TAG.db.sha256"
          sha256sum -c "columbo-$TAG.db.sha256"

      - name: Create draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          gh release create "$TAG" --draft --target main --title "Columbo database $TAG" \
            --notes-file notes.md "columbo-$TAG.db" "columbo-$TAG.db.sha256"

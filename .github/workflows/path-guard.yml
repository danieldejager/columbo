name: path-guard

# Runs from main after every checks run for a pull request, whatever its result,
# so a PR cannot avoid it by editing or failing its own copy of checks.yml.
# Takes effect only once this file is on main. Nothing from the PR head is
# checked out or run, and no secret is used.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  path-guard:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main (tool code only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Classify changed paths (fail closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 base/tools/checks/path_guard.py --repo-slug "$REPO" \
            --base-sha main --head-sha "$HEAD_SHA" --report "$RUNNER_TEMP/path-guard.json"

      - name: Report commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then state=success; desc="Paths are data only or code only"; else state=failure; desc="Mixed, empty or unreadable change set (fail closed)"; fi
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$state" -f context=path-guard -f description="$desc" > /dev/null
